name: verify-dist

# lib/ is committed so the plugin installs through the official plugin manager
# with no install-time build. This job fails when a source change was not
# followed by a rebuild, so the tracked artifacts can never go stale.
on:
  push:
  pull_request:

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: lib/ must match the sources
        run: git diff --exit-code -- lib
